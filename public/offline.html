<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0D2B6B" />
    <title>Shizu — Connexion perdue</title>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0D2B6B;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .logo {
        width: 80px;
        height: 80px;
        border-radius: 18px;
        margin-bottom: 28px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin-bottom: 10px;
      }
      p {
        font-size: 15px;
        color: rgba(255, 255, 255, 0.70);
        line-height: 1.55;
        max-width: 260px;
        margin-bottom: 36px;
      }
      button {
        background: #ffffff;
        color: #0D2B6B;
        border: none;
        border-radius: 14px;
        padding: 13px 36px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.15s;
      }
      button:active { opacity: 0.82; }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="Shizu" class="logo" />
    <h1>Connexion perdue</h1>
    <p>Vérifiez votre connexion internet et réessayez.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </body>
</html>
